# Browse without an account: search, open a listing, hearts ask for sign-in, info pages open.
# Same setup as signed-in-wishlist.yaml.
appId: com.saknly.mobile
---
- launchApp:
    clearState: true
- assertVisible: 'Welcome to Saknly'
- tapOn: 'Properties'
- assertVisible: 'Filters'
- tapOn:
    text: 'Add to wishlist'
    index: 0
# A signed-out heart goes to the sign-in screen instead of saving.
- assertVisible: 'Sign in'
- back
- tapOn: 'Account'
- tapOn: 'About Saknly'
- assertVisible: 'What is Saknly?'
- back
- tapOn: 'FAQ'
- tapOn: 'How do I delete my listing?'
- assertVisible: '.*Deleting is permanent.*'
